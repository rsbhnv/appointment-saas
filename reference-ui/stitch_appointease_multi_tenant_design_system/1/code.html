<!DOCTYPE html>

<html class="light" dir="rtl" lang="he"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {

                        "tertiary-fixed": "#e6deff",
                        "on-tertiary-container": "#eee7ff",
                        "secondary-container": "#e2ddf3",
                        "background": "#fcf8ff",
                        "error-container": "#ffdad6",
                        "outline-variant": "#c9c4d7",
                        "primary-fixed-dim": "#cabeff",
                        "on-secondary": "#ffffff",
                        "on-primary-fixed-variant": "#4720c2",
                        "inverse-on-surface": "#f3eeff",
                        "surface-variant": "#e4dfff",
                        "surface-bright": "#fcf8ff",
                        "inverse-primary": "#cabeff",
                        "on-background": "#1b1931",
                        "surface-container-lowest": "#ffffff",
                        "inverse-surface": "#302e47",
                        "primary": "#5230cd",
                        "tertiary": "#5342a1",
                        "on-surface-variant": "#484555",
                        "secondary-fixed": "#e4e0f6",
                        "primary-container": "#6b4ee6",
                        "on-secondary-container": "#636073",
                        "on-primary-fixed": "#1b0062",
                        "on-tertiary-fixed": "#1c0062",
                        "surface-container-highest": "#e4dfff",
                        "surface-container-high": "#eae5ff",
                        "on-tertiary-fixed-variant": "#483695",
                        "on-error": "#ffffff",
                        "tertiary-fixed-dim": "#cabeff",
                        "on-primary-container": "#eee7ff",
                        "outline": "#797586",
                        "surface-dim": "#dbd6f7",
                        "on-tertiary": "#ffffff",
                        "on-secondary-fixed": "#1b1a2a",
                        "on-error-container": "#93000a",
                        "surface-container-low": "#f6f1ff",
                        "on-primary": "#ffffff",
                        "primary-fixed": "#e6deff",
                        "on-surface": "#1b1931",
                        "error": "#ba1a1a",
                        "surface-tint": "#5f41da",
                        "secondary-fixed-dim": "#c8c4da",
                        "on-secondary-fixed-variant": "#474557",
                        "surface-container": "#f0ebff",
                        "tertiary-container": "#6c5bbb",
                        "surface": "#fcf8ff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "md": "24px",
                        "sm": "12px",
                        "gutter": "24px",
                        "margin-mobile": "16px",
                        "margin-desktop": "32px",
                        "xs": "4px",
                        "base": "8px",
                        "lg": "40px",
                        "xl": "64px"
                    },
                    "fontFamily": {
                        "body-md": ["Rubik"],
                        "headline-lg-mobile": ["Rubik"],
                        "display-lg": ["Rubik"],
                        "headline-lg": ["Rubik"],
                        "title-md": ["Rubik"],
                        "label-sm": ["Rubik"],
                        "body-lg": ["Rubik"]
                    },
                    "fontSize": {
                        "body-md": ["16px", {"lineHeight": "1.6", "letterSpacing": "0", "fontWeight": "400"}],
                        "headline-lg-mobile": ["28px", {"lineHeight": "1.3", "letterSpacing": "0", "fontWeight": "700"}],
                        "display-lg": ["48px", {"lineHeight": "1.2", "letterSpacing": "0", "fontWeight": "700"}],
                        "headline-lg": ["32px", {"lineHeight": "1.3", "letterSpacing": "0", "fontWeight": "700"}],
                        "title-md": ["20px", {"lineHeight": "1.4", "letterSpacing": "0", "fontWeight": "600"}],
                        "label-sm": ["14px", {"lineHeight": "1.4", "letterSpacing": "0.02em", "fontWeight": "500"}],
                        "body-lg": ["18px", {"lineHeight": "1.6", "letterSpacing": "0", "fontWeight": "400"}]
                    }
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Rubik', sans-serif;
            background-color: #fcf8ff;
            color: #1b1931;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .purple-shadow {
            box-shadow: 0px 4px 12px rgba(107, 78, 230, 0.08);
        }
        .step-active {
            @apply bg-primary-container text-on-primary-container;
        }
        .step-inactive {
            @apply bg-surface-container-high text-on-surface-variant;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="min-h-screen flex flex-col items-center">
<!-- Top Navigation Bar -->
<header class="bg-surface/80 dark:bg-surface-dim/80 backdrop-blur-md border-b border-outline-variant dark:border-on-surface-variant/10 flex flex-row-reverse justify-between items-center h-[60px] px-margin-mobile w-full z-50 sticky top-0">
<div class="flex items-center gap-base">
<span class="font-headline-lg-mobile text-headline-lg-mobile font-bold text-primary dark:text-inverse-primary">AppointEase</span>
</div>
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-primary-container/10 transition-colors">
<span class="material-symbols-outlined text-primary dark:text-inverse-primary">menu</span>
</button>
</header>
<main class="w-full max-w-md px-margin-mobile pt-lg pb-xl flex flex-col gap-lg overflow-x-hidden">
<!-- Booking Stepper -->
<div class="flex flex-row-reverse items-center justify-between w-full relative px-sm">
<!-- Connector Line -->
<div class="absolute top-5 left-8 right-8 h-0.5 bg-surface-container-highest -z-10"></div>
<!-- Step 1 (Active) -->
<div class="flex flex-col items-center gap-xs">
<div class="w-10 h-10 rounded-full flex items-center justify-center bg-primary-container text-on-primary-container font-bold shadow-md">1</div>
<span class="font-label-sm text-label-sm text-primary font-bold">זיהוי</span>
</div>
<!-- Step 2 -->
<div class="flex flex-col items-center gap-xs">
<div class="w-10 h-10 rounded-full flex items-center justify-center bg-surface-container-highest text-outline font-medium">2</div>
<span class="font-label-sm text-label-sm text-outline">שירות</span>
</div>
<!-- Step 3 -->
<div class="flex flex-col items-center gap-xs">
<div class="w-10 h-10 rounded-full flex items-center justify-center bg-surface-container-highest text-outline font-medium">3</div>
<span class="font-label-sm text-label-sm text-outline">זמן</span>
</div>
<!-- Step 4 -->
<div class="flex flex-col items-center gap-xs">
<div class="w-10 h-10 rounded-full flex items-center justify-center bg-surface-container-highest text-outline font-medium">4</div>
<span class="font-label-sm text-label-sm text-outline">סיום</span>
</div>
</div>
<!-- Identification Card -->
<section class="bg-surface-container-lowest p-md rounded-xl purple-shadow border border-outline-variant/30 animate-in fade-in slide-in-from-bottom-4 duration-500">
<div class="mb-lg">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface mb-xs">הזינו פרטי זיהוי</h1>
<p class="font-body-md text-body-md text-on-surface-variant">מלאו את הפרטים הבאים כדי שנוכל לזהות אתכם במערכת ולנהל את התור עבורכם.</p>
</div>
<form class="flex flex-col gap-md">
<!-- Phone Input -->
<div class="flex flex-col gap-xs">
<label class="font-label-sm text-label-sm text-on-surface font-semibold mr-xs" for="phone">מספר טלפון *</label>
<div class="relative">
<input class="w-full bg-surface-container h-12 px-md rounded-lg border border-outline-variant/50 focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all font-body-md text-left" dir="ltr" id="phone" placeholder="050-000-0000" type="tel"/>
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant opacity-60">call</span>
</div>
</div>
<!-- Name Input (Optional) -->
<div class="flex flex-col gap-xs">
<label class="font-label-sm text-label-sm text-on-surface font-semibold mr-xs" for="fullname">שם מלא (אופציונלי)</label>
<div class="relative">
<input class="w-full bg-surface-container h-12 px-md rounded-lg border border-outline-variant/50 focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all font-body-md" id="fullname" placeholder="ישראל ישראלי" type="text"/>
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant opacity-60">person</span>
</div>
</div>
<div class="mt-base flex flex-col gap-sm">
<p class="font-label-sm text-label-sm text-outline text-center">
                        בלחיצה על "המשך" הנך מאשר את תנאי השימוש
                    </p>
<button class="w-full h-14 bg-primary text-on-primary rounded-lg font-title-md text-title-md shadow-md active:scale-95 transition-transform hover:bg-primary/90 flex items-center justify-center gap-sm group" type="submit">
<span>המשך</span>
<span class="material-symbols-outlined group-hover:-translate-x-1 transition-transform">arrow_back</span>
</button>
</div>
</form>
</section>
<!-- Trust Indicator -->
<div class="flex items-center justify-center gap-sm opacity-60 grayscale mt-md">
<span class="material-symbols-outlined text-on-surface-variant">verified_user</span>
<span class="font-label-sm text-label-sm text-on-surface-variant">החיבור מאובטח ומוצפן</span>
</div>
</main>
<!-- Bottom Navigation Bar (Mobile Only Filter) -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex flex-row-reverse justify-around items-center h-16 px-4 bg-surface dark:bg-inverse-surface pb-safe border-t border-outline-variant/30 shadow-[0_-4px_12px_rgba(107,78,230,0.08)] md:hidden">
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline hover:bg-secondary-fixed/20 transition-all p-2 rounded-lg" href="#">
<span class="material-symbols-outlined">home</span>
<span class="font-label-sm text-label-sm">בית</span>
</a>
<a class="flex flex-col items-center justify-center text-primary dark:text-inverse-primary font-bold hover:bg-secondary-fixed/20 transition-all p-2 rounded-lg" href="#">
<span class="material-symbols-outlined">event_note</span>
<span class="font-label-sm text-label-sm">תור חדש</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline hover:bg-secondary-fixed/20 transition-all p-2 rounded-lg" href="#">
<span class="material-symbols-outlined">chat_bubble</span>
<span class="font-label-sm text-label-sm">הודעות</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline hover:bg-secondary-fixed/20 transition-all p-2 rounded-lg" href="#">
<span class="material-symbols-outlined">person</span>
<span class="font-label-sm text-label-sm">פרופיל</span>
</a>
</nav>
<script>
        // Simple input masking simulation
        const phoneInput = document.getElementById('phone');
        phoneInput.addEventListener('input', (e) => {
            let val = e.target.value.replace(/\D/g, '');
            if (val.length > 10) val = val.slice(0, 10);
            
            if (val.length > 3 && val.length <= 6) {
                val = val.slice(0, 3) + '-' + val.slice(3);
            } else if (val.length > 6) {
                val = val.slice(0, 3) + '-' + val.slice(3, 6) + '-' + val.slice(6);
            }
            e.target.value = val;
        });

        // Form Submission animation
        document.querySelector('form').addEventListener('submit', (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            btn.innerHTML = '<span class="material-symbols-outlined animate-spin">progress_activity</span>';
            setTimeout(() => {
                // Mimic transition
                btn.innerHTML = '<span class="material-symbols-outlined">check_circle</span>';
                setTimeout(() => {
                    alert('מעבר לשלב הבחירה...');
                }, 500);
            }, 1000);
        });
    </script>
</body></html>
