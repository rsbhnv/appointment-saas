<!DOCTYPE html>

<html class="light" dir="rtl" lang="he"><head>
<meta charset="utf-8"/>

                        "on-secondary-container": "#636073",
                        "primary-fixed": "#e6deff",
                        "tertiary-container": "#6c5bbb",
                        "surface-container": "#f0ebff",
                        "on-primary": "#ffffff",
                        "surface-container-high": "#eae5ff",

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .active-tab-glow {
            box-shadow: 0px 4px 12px rgba(107, 78, 230, 0.08);
        }
        ::-webkit-scrollbar {
            display: none;
        }
        .pb-safe {
            padding-bottom: env(safe-area-inset-bottom);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background font-body-md text-body-md overflow-x-hidden selection:bg-primary-container selection:text-on-primary-container">
<!-- Top App Bar -->
<header class="bg-surface/80 backdrop-blur-md text-primary sticky top-0 z-50 flex flex-row-reverse justify-between items-center h-[60px] px-margin-mobile w-full border-b border-outline-variant/30">
<div class="flex items-center gap-sm">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile font-bold">AppointEase</h1>
</div>
<button class="w-10 h-10 flex items-center justify-center hover:bg-primary-container/10 transition-colors rounded-full">
<span class="material-symbols-outlined">menu</span>
</button>
</header>
<main class="max-w-md mx-auto px-margin-mobile pt-md pb-[120px]">
<!-- 3-Step Stepper -->
<div class="flex justify-between items-center mb-xl relative">
<div class="absolute top-1/2 left-0 right-0 h-[2px] bg-surface-container-highest -z-10 -translate-y-1/2"></div>
<!-- Step 1: Checked -->
<div class="flex flex-col items-center gap-xs">
<div class="w-8 h-8 rounded-full bg-primary-container text-on-primary-container flex items-center justify-center shadow-md">
<span class="material-symbols-outlined text-[18px]" style="font-variation-settings: 'wght' 700;">check</span>
</div>
<span class="font-label-sm text-label-sm text-on-surface-variant">פרטים</span>
</div>
<!-- Step 2: Active -->
<div class="flex flex-col items-center gap-xs">
<div class="w-8 h-8 rounded-full bg-primary text-on-primary flex items-center justify-center border-4 border-primary-container shadow-md">
<span class="font-bold">2</span>
</div>
<span class="font-label-sm text-label-sm text-primary font-bold">שירות וזמן</span>
</div>
<!-- Step 3: Inactive -->
<div class="flex flex-col items-center gap-xs">
<div class="w-8 h-8 rounded-full bg-surface-container-highest text-outline flex items-center justify-center">
<span class="font-bold">3</span>
</div>
<span class="font-label-sm text-label-sm text-outline">אישור</span>
</div>
</div>
<!-- Collapsed Step 1 Card -->
<div class="bg-surface-container-low/60 border border-outline-variant/30 rounded-xl p-md mb-md flex items-center justify-between opacity-60">
<div class="flex items-center gap-md">
<div class="text-primary">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
<div>
<h3 class="font-title-md text-title-md text-on-surface-variant">פרטי קשר</h3>
<p class="text-on-surface-variant/80 text-sm">050-1234567 | ישראל ישראלי</p>
</div>
</div>
<button class="text-primary text-sm font-bold">ערוך</button>
</div>
<!-- Section: Service Selection -->
<section class="mb-lg">
<div class="flex items-center justify-between mb-sm">
<h2 class="font-title-md text-title-md">בחירת שירות</h2>
<span class="text-sm text-on-surface-variant">בחרו שירות אחד</span>
</div>
<div class="space-y-sm">
<!-- Service Card: Selected -->
<div class="bg-primary-container/10 border-2 border-primary rounded-xl p-md flex items-center justify-between transition-all duration-300">
<div class="flex flex-col gap-xs">
<span class="font-bold text-on-surface">תספורת גברים</span>
<div class="flex items-center gap-xs text-on-surface-variant text-sm">
<span class="material-symbols-outlined text-[16px]">schedule</span>
<span>30 דקות</span>
</div>
</div>
<div class="text-left">
<span class="font-bold text-primary text-lg">₪70</span>
</div>
</div>
<!-- Service Card: Not Selected -->
<div class="bg-surface-container-lowest border border-outline-variant/30 rounded-xl p-md flex items-center justify-between hover:border-primary/40 transition-all cursor-pointer">
<div class="flex flex-col gap-xs">
<span class="font-bold text-on-surface">עיצוב זקן</span>
<div class="flex items-center gap-xs text-on-surface-variant text-sm">
<span class="material-symbols-outlined text-[16px]">schedule</span>
<span>15 דקות</span>
</div>
</div>
<div class="text-left">
<span class="font-bold text-primary text-lg">₪40</span>
</div>
</div>
<!-- Service Card: Not Selected -->
<div class="bg-surface-container-lowest border border-outline-variant/30 rounded-xl p-md flex items-center justify-between hover:border-primary/40 transition-all cursor-pointer">
<div class="flex flex-col gap-xs">
<span class="font-bold text-on-surface">קומבו: תספורת + זקן</span>
<div class="flex items-center gap-xs text-on-surface-variant text-sm">
<span class="material-symbols-outlined text-[16px]">schedule</span>
<span>45 דקות</span>
</div>
</div>
<div class="text-left">
<span class="font-bold text-primary text-lg">₪100</span>
</div>
</div>
</div>
</section>
<!-- Section: Date Selection -->
<section class="mb-lg">
<h2 class="font-title-md text-title-md mb-sm">בחירת תאריך</h2>
<div class="flex gap-sm overflow-x-auto pb-xs no-scrollbar">
<button class="flex-shrink-0 px-md py-sm rounded-full bg-primary text-on-primary font-bold shadow-md active:scale-95 transition-all">היום</button>
<button class="flex-shrink-0 px-md py-sm rounded-full bg-surface-container-high text-on-surface-variant border border-outline-variant/20 active:scale-95 transition-all">מחר</button>
<button class="flex-shrink-0 px-md py-sm rounded-full bg-surface-container-high text-on-surface-variant border border-outline-variant/20 active:scale-95 transition-all">יום ג׳</button>
<button class="flex-shrink-0 px-md py-sm rounded-full bg-surface-container-high text-on-surface-variant border border-outline-variant/20 active:scale-95 transition-all">יום ד׳</button>
</div>
</section>
<!-- Section: Time Slots Grid -->
<section>
<div class="flex items-center justify-between mb-sm">
<h2 class="font-title-md text-title-md">שעות פנויות</h2>
<div class="flex items-center gap-xs text-on-surface-variant text-sm">
<span class="material-symbols-outlined text-[18px]">wb_sunny</span>
<span>בוקר</span>
</div>
</div>
<div class="grid grid-cols-4 gap-sm">
<button class="py-sm rounded-lg bg-surface-container-highest text-on-surface border border-outline-variant/30 hover:bg-primary-container/10 transition-colors">09:00</button>
<button class="py-sm rounded-lg bg-surface-container-highest text-on-surface border border-outline-variant/30 hover:bg-primary-container/10 transition-colors">09:30</button>
<button class="py-sm rounded-lg bg-primary text-on-primary font-bold shadow-md transition-transform scale-105 ring-2 ring-primary-container ring-offset-2 ring-offset-background">10:00</button>
<button class="py-sm rounded-lg bg-surface-container-highest text-on-surface border border-outline-variant/30 hover:bg-primary-container/10 transition-colors">10:30</button>
<button class="py-sm rounded-lg bg-surface-container-highest text-on-surface border border-outline-variant/30 hover:bg-primary-container/10 transition-colors">11:00</button>
<button class="py-sm rounded-lg bg-surface-container-highest text-on-surface border border-outline-variant/30 hover:bg-primary-container/10 transition-colors">11:30</button>
<button class="py-sm rounded-lg bg-surface-container-highest text-on-surface border border-outline-variant/30 opacity-40 cursor-not-allowed">12:00</button>
<button class="py-sm rounded-lg bg-surface-container-highest text-on-surface border border-outline-variant/30 hover:bg-primary-container/10 transition-colors">12:30</button>
</div>
<div class="flex items-center gap-xs text-on-surface-variant text-sm mt-md mb-sm">
<span class="material-symbols-outlined text-[18px]">bedtime</span>
<span>אחה״צ וערב</span>
</div>
<div class="grid grid-cols-4 gap-sm">
<button class="py-sm rounded-lg bg-surface-container-highest text-on-surface border border-outline-variant/30 hover:bg-primary-container/10 transition-colors">16:00</button>
<button class="py-sm rounded-lg bg-surface-container-highest text-on-surface border border-outline-variant/30 hover:bg-primary-container/10 transition-colors">16:30</button>
<button class="py-sm rounded-lg bg-surface-container-highest text-on-surface border border-outline-variant/30 hover:bg-primary-container/10 transition-colors">17:00</button>
<button class="py-sm rounded-lg bg-surface-container-highest text-on-surface border border-outline-variant/30 hover:bg-primary-container/10 transition-colors">17:30</button>
</div>
</section>
</main>
<!-- Fixed Footer Actions -->
<footer class="fixed bottom-0 left-0 w-full z-50 bg-surface/90 backdrop-blur-xl border-t border-outline-variant/20 shadow-[0_-4px_12px_rgba(107,78,230,0.08)] pb-safe">
<div class="max-w-md mx-auto px-margin-mobile h-[80px] flex items-center gap-md">
<button class="flex-1 py-sm px-md rounded-xl bg-primary text-on-primary font-bold shadow-lg shadow-primary/20 active:scale-95 transition-all text-lg">
                המשך לאישור
            </button>
<button class="w-[100px] py-sm px-md rounded-xl bg-secondary-fixed text-primary font-bold active:scale-95 transition-all border border-primary/10">
                חזרה
            </button>
</div>
</footer>
<!-- Tab Bar for Shell Integrity (BottomNavBar Replacement for this specific view) -->
<!-- Not visible as footer takes priority, but kept for context as per instructions -->
<script>
        // Micro-interactions for selections
        document.querySelectorAll('section button, section .bg-surface-container-lowest').forEach(el => {
            el.addEventListener('click', function() {
                // If it's a date pill
                if (this.parentNode.classList.contains('overflow-x-auto')) {
                    this.parentNode.querySelectorAll('button').forEach(btn => {
                        btn.className = "flex-shrink-0 px-md py-sm rounded-full bg-surface-container-high text-on-surface-variant border border-outline-variant/20 active:scale-95 transition-all";
                    });
                    this.className = "flex-shrink-0 px-md py-sm rounded-full bg-primary text-on-primary font-bold shadow-md active:scale-95 transition-all";
                }
                
                // If it's a time slot
                if (this.parentNode.classList.contains('grid')) {
                    this.parentNode.parentNode.querySelectorAll('.grid button').forEach(btn => {
                        if(!btn.classList.contains('opacity-40')) {
                           btn.className = "py-sm rounded-lg bg-surface-container-highest text-on-surface border border-outline-variant/30 hover:bg-primary-container/10 transition-colors";
                        }
                    });
                    if(!this.classList.contains('opacity-40')) {
                        this.className = "py-sm rounded-lg bg-primary text-on-primary font-bold shadow-md transition-transform scale-105 ring-2 ring-primary-container ring-offset-2 ring-offset-background";
                    }
                }
            });
        });
    </script>
</body></html>
