<style>

<body class="min-h-screen flex flex-col items-center justify-center p-margin-mobile md:p-margin-desktop bg-surface">
<!-- Logo Section -->
<div class="mb-lg animate-in fade-in slide-in-from-top duration-700">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-primary font-extrabold tracking-tight">
            AppointEase
        </h1>
</div>
<!-- Login Card -->
<main class="w-full max-w-[440px] bg-white rounded-xl p-md md:p-lg purple-shadow animate-in fade-in zoom-in-95 duration-500">
<div class="text-center mb-md">
<h2 class="font-title-md text-title-md text-on-surface mb-xs">התחברות</h2>
<p class="font-body-md text-body-md text-on-surface-variant">ברוכים השבים למערכת ניהול התורים שלכם</p>
</div>
<form class="space-y-md" onsubmit="return false;">
<!-- Email Field -->
<div class="space-y-xs">
<label class="block font-label-sm text-label-sm text-on-surface-variant text-right" for="email">כתובת אימייל</label>
<div class="relative">
<input class="w-full h-12 px-md py-sm bg-surface-container-lowest border border-outline-variant/30 rounded-lg text-on-surface font-body-md input-focus-ring transition-all placeholder:text-outline/50 text-right" id="email" name="email" placeholder="name@business.com" required="" type="email"/>
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline/50">mail</span>
</div>
</div>
<!-- Password Field -->
<div class="space-y-xs">
<div class="flex justify-between items-center">
<a class="font-label-sm text-label-sm text-primary hover:underline transition-all" href="#">שכחת סיסמה?</a>
<label class="block font-label-sm text-label-sm text-on-surface-variant" for="password">סיסמה</label>
</div>
<div class="relative">
<input class="w-full h-12 px-md py-sm bg-surface-container-lowest border border-outline-variant/30 rounded-lg text-on-surface font-body-md input-focus-ring transition-all placeholder:text-outline/50 text-right" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute left-3 top-1/2 -translate-y-1/2 text-outline/50 hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined">visibility</span>
</button>
</div>
</div>
<!-- Primary Action -->
<button class="w-full h-12 bg-primary-container text-on-primary font-title-md text-title-md rounded-lg hover:opacity-90 active:scale-[0.98] transition-all flex items-center justify-center gap-xs" type="submit">
                התחבר
                <span class="material-symbols-outlined">login</span>
</button>
<!-- Divider -->
<div class="relative flex items-center py-base">
<div class="flex-grow border-t border-outline-variant/30"></div>
<span class="flex-shrink mx-4 text-outline font-label-sm text-label-sm">או באמצעות</span>
<div class="flex-grow border-t border-outline-variant/30"></div>
</div>
<!-- Social OAuth -->
<button class="w-full h-12 bg-surface-container-lowest border border-outline-variant/30 text-on-surface-variant font-label-sm text-label-sm rounded-lg hover:bg-surface-container-low transition-all flex items-center justify-center gap-sm" type="button">
<img alt="Google" class="w-5 h-5" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCJgbkIpIhYM8vdFUelau5RPzUccKv1UFAeQttXUMclqSkuAsXySe5wU5G-Eg7y_RT1Y7HLyABKJvvHxUiOPBqZvpyMxQzeSlSlFe0cF0dhQXCUXDZCgFnRQAADDVOCG1AEJs9mS8ufJt0UbLvTM-LQ4P0eWVTfdFAE2xZI-kOG_7m4gJLShbKYiUq5TiqMBU1-ef0cJi8NJr1-TdHWLAN_rBogVz-6Ldv-4O2pSjirKpCg1QXlN6BlEJ3GM1OjTMlgQYoYsZ0Jmu0"/>
                התחברות באמצעות Google
            </button>
</form>
<!-- Footer Link -->
<div class="mt-lg text-center">
<p class="font-body-md text-body-md text-on-surface-variant">
                עדיין אין חשבון? 
                <a class="text-primary font-bold hover:underline" href="#">הירשמו</a>
</p>
</div>
</main>
<!-- Decorative Elements -->
<div class="fixed bottom-0 left-0 w-full p-md text-center opacity-40 pointer-events-none">
<p class="font-label-sm text-label-sm text-outline">© 2024 AppointEase B2B Solutions. כל הזכויות שמורות.</p>
</div>
<!-- Background Illustration Placeholder (Minimalist) -->
<div class="fixed top-1/2 -right-24 -translate-y-1/2 w-64 h-64 bg-primary/5 rounded-full blur-3xl -z-10"></div>
<div class="fixed bottom-1/4 -left-24 w-80 h-80 bg-tertiary/5 rounded-full blur-3xl -z-10"></div>
<script>
        // Simple Interaction logic
        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.parentElement.querySelector('label').classList.add('text-primary');
            });
            input.addEventListener('blur', () => {
                input.parentElement.parentElement.querySelector('label').classList.remove('text-primary');
            });
        });

        // Toggle Password Visibility
        const toggleBtn = document.querySelector('button[type="button"] span.material-symbols-outlined');
        if (toggleBtn) {
            toggleBtn.parentElement.addEventListener('click', () => {
                const passwordInput = document.getElementById('password');
                if (passwordInput.type === 'password') {
                    passwordInput.type = 'text';
                    toggleBtn.textContent = 'visibility_off';
                } else {
                    passwordInput.type = 'password';
                    toggleBtn.textContent = 'visibility';
                }
            });
        }
    </script>
